name: bigo complexity diff (moved)
description: >
  DEPRECATED - moved to RomanAgaltsev/bigo-action. This delegator will be
  removed in the next minor release; switch `uses:` to
  RomanAgaltsev/bigo-action@v1.
branding:
  icon: trending-up
  color: blue

inputs:
  working-directory:
    description: Directory of the Go module to analyze.
    required: false
    default: "."
  packages:
    description: Package patterns to analyze.
    required: false
    default: "./..."
  fail-on:
    description: >
      Exit-code policy: none (report only, the default), break (fail on a broken
      budget or a new function already over budget), or regression (also fail on
      a proven asymptotic regression in unbudgeted code).
    required: false
    default: none
  comment:
    description: Post/update a single PR comment with the findings.
    required: false
    default: "true"
  bigo-version:
    description: >
      Version of bigo to install, e.g. v1.20.0 or latest. Use `none` to skip
      installation and run whatever bigo is already on PATH.
    required: false
    default: latest
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}

outputs:
  findings:
    description: The rendered markdown findings body.
    value: ${{ steps.delegate.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Deprecation notice
      shell: bash
      run: |
        echo "::warning::RomanAgaltsev/bigo has moved to RomanAgaltsev/bigo-action. Update your uses: line; this delegator is removed in the next minor."

    - name: Delegate
      id: delegate
      uses: RomanAgaltsev/bigo-action@v1
      with:
        working-directory: ${{ inputs.working-directory }}
        packages: ${{ inputs.packages }}
        fail-on: ${{ inputs.fail-on }}
        comment: ${{ inputs.comment }}
        bigo-version: ${{ inputs.bigo-version }}
        github-token: ${{ inputs.github-token }}
