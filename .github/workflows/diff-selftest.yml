name: diff-selftest

# Contract test, side 1 — adoption-artifacts spec §5.
#
# The Action now lives at RomanAgaltsev/bigo-action. This repo consumes the
# PUBLISHED action, so the side that can break the CLI contract is the side
# that fails. Two jobs, because there are two different things to test and
# merging them tests neither properly:
#
#   contract — builds THIS PR's bigo and runs the published action against it
#              with `bigo-version: none`. A PR that renames a flag, changes an
#              exit code or moves the report schema fails HERE, before merge.
#              With `latest` it would run against the last RELEASE — the old,
#              still-working binary — and pass.
#
#   released — runs the published action against bigo@latest. This is what this
#              job originally existed for: breakage that only appears once a
#              release ships. Its old comment made the point that pointing the
#              job at the PR's own binary "would mask exactly the release
#              breakage this job exists to catch" — which is why that case is
#              kept rather than replaced.
#
# Report-only throughout: neither job may block a bigo PR.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the Action needs the base commit to build a worktree

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build this PR's bigo onto PATH
        run: go install ./cmd/bigo

      # comment: false — the `released` job owns the PR comment; two actions
      # writing the same marker would fight over it.
      - uses: RomanAgaltsev/bigo-action@v1
        with:
          fail-on: none
          bigo-version: none
          comment: "false"

  released:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: RomanAgaltsev/bigo-action@v1
        with:
          fail-on: none
          bigo-version: latest
