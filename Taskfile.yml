version: "3"


vars:
  # -race needs cgo, and cgo needs a C toolchain -- which this workstation has no
  # gcc for, so the native race tasks cannot even build here. The :docker tasks
  # run the identical gate in a Linux container, which is also the platform CI
  # runs on. `task toolchain:check` reports which of them you can use.
  GO_IMAGE: "golang:1.26"
  DOCKER_RUN: >-
    docker run --rm
    -v "{{.ROOT_DIR | replace "\\" "/"}}:/src"
    -v go-race-modcache:/go/pkg/mod
    -v go-race-buildcache:/root/.cache/go-build
    -w /src {{.GO_IMAGE}}

tasks:
  metrics:
    desc: Regenerate the coverage golden (metrics/metrics.json + metrics/METRICS.md)
    cmds:
      - go test ./internal/metrics/ -run TestGolden -update

  survey:
    desc: Run the real-world survey over survey/targets.json (MANUAL — not a CI gate)
    cmds:
      - go test ./internal/survey/ -run TestSurvey -update -timeout 60m -v

  whatif:
    desc: "Run the what-if harness over survey targets (MANUAL — not a CI gate). Usage: task whatif -- candidates.json"
    cmds:
      - go test ./internal/survey/ -run TestWhatIf -whatif {{.CLI_ARGS}} -timeout 120m -v

  contrib-scan:
    desc: Run the contribution scan over survey/contribution-targets.json (MANUAL — not a CI gate)
    cmds:
      - go test ./internal/survey/ -run TestContribScan -contrib -timeout 60m -v

  corpus:
    desc: Regenerate the canonical-corpus oracle golden (corpus/corpus.json + corpus/CORPUS.md)
    cmds:
      - go test ./internal/oracle/ -run TestGolden -update

  kata-corpus:
    desc: Regenerate the kata-corpus golden (corpus/kata.json + corpus/KATA.md)
    cmds:
      - go test ./internal/oracle/ -run TestKataGolden -update

  report-golden:
    desc: Regenerate the report schema golden (internal/report/testdata/golden/report.json)
    cmds:
      - go test ./internal/report/ -run TestGolden -update

  build:
    desc: Rebuild bin/bigo-dev.exe from the working tree — run this BEFORE measuring behaviour
    cmds:
      - go build -o bin/bigo-dev.exe ./cmd/bigo

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test ./... -race
  cover:
    desc: Run tests with coverage
    cmds:
      - go test ./... -coverprofile=coverage.out
  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run
  lint:custom:
    desc: Build the custom golangci-lint (with the bigo plugin) and run bigo on this repo
    cmds:
      - golangci-lint custom
      - '{{if eq OS "windows"}}./bin/custom-gcl.exe{{else}}./bin/custom-gcl{{end}} run -c .golangci.custom.yml'
  tidy:
    desc: Tidy modules
    cmds:
      - go mod tidy
  security:
    desc: Run gosec with the same arguments as the security workflow
    cmds:
      - gosec -exclude-dir=testdata ./...

  ci:
    desc: Full local CI (tidy, lint, security, test)
    deps: [tidy, lint, security, test]

  test:docker:
    desc: race tests in a Linux container (no local C toolchain needed)
    cmds:
      - "{{.DOCKER_RUN}} go test ./... -race"

  test:norace:
    desc: tests WITHOUT the race detector -- a partial gate
    cmds:
      - echo "WARNING -- running without -race. This does NOT satisfy the gate."
      - go test ./...

  toolchain:check:
    desc: report which of test / test:docker / test:norace can run here
    silent: true
    cmds:
      - if command -v gcc >/dev/null 2>&1; then echo "C toolchain -- $(gcc --version | head -1)"; else echo "C toolchain -- none; the native race task cannot build, use the :docker one"; fi
      - if docker version >/dev/null 2>&1; then echo "docker -- available"; else echo "docker -- none; only a no-race run is left, and it does NOT satisfy the gate"; fi

  ci:docker:
    desc: full local CI with the race step in a container
    deps: [tidy, lint, security, test:docker]
